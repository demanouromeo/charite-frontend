<div class="tab-content">
  <div class="tab-header">
    <p class="hint">Une seule année scolaire peut être active à la fois.</p>
    @if (isAdmin()) {
      <button mat-flat-button color="primary" (click)="ouvrirCreation()">
        <mat-icon>add</mat-icon>
        Nouvelle année scolaire
      </button>
    }
  </div>

  <table mat-table [dataSource]="annees()" class="mat-elevation-z1 full-width">
    <ng-container matColumnDef="libelle">
      <th mat-header-cell *matHeaderCellDef>Année</th>
      <td mat-cell *matCellDef="let annee">{{ annee.libelle }}</td>
    </ng-container>

    <ng-container matColumnDef="date_debut">
      <th mat-header-cell *matHeaderCellDef>Début</th>
      <td mat-cell *matCellDef="let annee">{{ annee.date_debut }}</td>
    </ng-container>

    <ng-container matColumnDef="date_fin">
      <th mat-header-cell *matHeaderCellDef>Fin</th>
      <td mat-cell *matCellDef="let annee">{{ annee.date_fin }}</td>
    </ng-container>

    <ng-container matColumnDef="statut">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let annee">
        @if (annee.is_active) {
          <span class="statut-chip">Active</span>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let annee">
        @if (isAdmin()) {
          @if (!annee.is_active) {
            <button mat-icon-button matTooltip="Activer" (click)="activer(annee)">
              <mat-icon>check_circle</mat-icon>
            </button>
          }
          <button mat-icon-button matTooltip="Supprimer" (click)="supprimer(annee)">
            <mat-icon>delete</mat-icon>
          </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
