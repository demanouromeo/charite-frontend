<div class="tab-content">
  <div class="tab-header">
    <p class="hint">Référentiel des matières, réutilisé lors de la définition des coefficients par classe/année.</p>
    <button mat-flat-button color="primary" (click)="ouvrirCreation()">
      <mat-icon>add</mat-icon>
      Nouvelle matière
    </button>
  </div>

  <table mat-table [dataSource]="matieres()" class="mat-elevation-z1 full-width">
    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Matière</th>
      <td mat-cell *matCellDef="let matiere">{{ matiere.nom }}</td>
    </ng-container>

    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let matiere">{{ matiere.code }}</td>
    </ng-container>

    <ng-container matColumnDef="section">
      <th mat-header-cell *matHeaderCellDef>Section</th>
      <td mat-cell *matCellDef="let matiere">{{ matiere.section?.nom ?? 'Commune' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let matiere">
        <button mat-icon-button matTooltip="Modifier" (click)="ouvrirEdition(matiere)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Supprimer" (click)="supprimer(matiere)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
