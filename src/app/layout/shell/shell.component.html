<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="isHandset()"
    class="sidenav"
  >
    <div class="brand">
      <img src="/assets/logo.png" alt="Logo" class="brand-logo" />
      <span class="brand-name">{{ ecole.nom }}</span>
    </div>

    <mat-nav-list>
      @for (item of menuItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Ouvrir le menu">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="brand-name-mobile">{{ ecole.nom }}</span>
      }
      <span class="spacer"></span>
      <span class="contact">{{ ecole.telephone }} · {{ ecole.email }}</span>

      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="menu-user-info">
          <strong>{{ authService.currentUser()?.nom_complet }}</strong>
          <span>{{ authService.currentUser()?.email }}</span>
        </div>
        <a mat-menu-item routerLink="/profil">
          <mat-icon>settings</mat-icon>
          <span>Mon profil</span>
        </a>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Déconnexion</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
